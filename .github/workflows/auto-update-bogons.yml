name: Auto update bogon list

on:
  workflow_dispatch:
  schedule:
    # Run at :42 every hour
    # https://www.team-cymru.com/bogon-reference-http
    - cron: "42 * * * *"

permissions:
  contents: write

jobs:
  update:
    name: Update bogon list
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Update bogon list
        run: |
          python3 scripts/update_bogons.py

      - name: Check for file changes
        id: git-check
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push to main
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config user.name "flux-ci[bot]"
          git config user.email "283426290+flux-ci[bot]@users.noreply.github.com"
          git add .
          git commit -m "update ip bogon list"
          git push origin main
